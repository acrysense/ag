name: Build Pages + Release (Bitrix-ready)

on:
  push:
    # proto/fixed-scale — прототип «без масштаба, как сайт» для сравнения: демо /ag/proto/
    branches: [ main, proto/fixed-scale ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-gh:
    runs-on: ubuntu-latest
    steps:
      # Демо всегда из main (и при пуше в ветку прототипа)
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm i
      - name: Build for GitHub Pages
        env:
          MODE: gh
          BASE: /ag/
          SITE_URL: https://acrysense.github.io
          CANONICAL_BASE: https://acrysense.github.io/ag/
          CANONICAL_OFF: "0"
        run: |
          npm run prebuild || echo "no prebuild"
          npm run build
      # Прототип для сравнения (ветка proto/fixed-scale) — рядом, в /ag/proto/; нет ветки — пропуск
      - name: Build prototype into /ag/proto/
        env:
          MODE: gh
          BASE: /ag/proto/
          SITE_URL: https://acrysense.github.io
          CANONICAL_BASE: https://acrysense.github.io/ag/proto/
          CANONICAL_OFF: "1"
        run: |
          if git ls-remote --exit-code --heads origin proto/fixed-scale; then
            git fetch --depth 1 origin proto/fixed-scale
            git worktree add ../proto FETCH_HEAD
            cd ../proto
            npm i
            npm run prebuild || echo "no prebuild"
            npm run build
            cp -R dist "$GITHUB_WORKSPACE/dist/proto"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }

  deploy-pages:
    needs: build-gh
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4

  build-cms:
    if: github.ref != 'refs/heads/proto/fixed-scale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm i
      - name: Build for Bitrix (CMS)
        env:
          MODE: cms
          BASE: /bitrix/templates/auth/
          CANONICAL_OFF: "1"
        run: |
          npm run prebuild || echo "no prebuild"
          npm run build
          cd dist && zip -r ../dist.zip . && cd ..
      - name: Upload CMS dist (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dist-cms
          path: dist.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-cms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-cms
          path: .
      - name: Create GitHub Release with dist.zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          generate_release_notes: true