<!doctype html>
<html lang="{{ lang }}">
	<head>
		{{> layouts/Head/Head }}
		<script type="module" src="/app.js"></script>
	</head>
	<body class="bg-light pharmacy-page">
		<div class="app-loader" data-app-loader aria-hidden="true"><span class="app-loader__spinner"></span></div>
		<div class="wrapper">
			{{> layouts/Header/Header }}
			<main class="wrapper__content">
				{{> layouts/Sidebar/Sidebar }}
				<div class="wrapper__main">
					<div class="wrapper__container">
						<a href="/pharmacies" class="wrapper__back">
							<svg aria-hidden="true" focusable="false" width="16" height="16"><use href="#icon-arrow-back-thin"></use></svg>
							<span>Назад</span>
						</a>

						<!--
							Профильная заглушка «Аптека не найдена» (референс для бэка):
							тот же блок .visit-empty — иконка #icon-erp-pharmacies и свои тексты.
						-->
						<section class="data-panel visit-empty">
							<span class="visit-empty__icon">
								<svg aria-hidden="true" focusable="false" width="28" height="28"><use href="#icon-erp-pharmacies"></use></svg>
							</span>
							<h1 class="visit-empty__title">Аптека не найдена</h1>
							<p class="visit-empty__text">Возможно, карточка аптеки была удалена или изменился её адрес. Проверьте ссылку или вернитесь к списку аптек.</p>
							<div class="visit-empty__actions">
								<a href="/pharmacies" class="btn">К списку аптек</a>
								<a href="/" class="btn btn--secondary">На главную</a>
							</div>
						</section>
					</div>
				</div>
			</main>
			{{> layouts/Footer/Footer }}
		</div>
	</body>
</html>
