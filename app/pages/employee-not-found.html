<!doctype html>
<html lang="{{ lang }}">
	<head>
		{{> layouts/Head/Head }}
		<script type="module" src="/app.js"></script>
	</head>
	<body class="bg-light employee-page">
		<div class="app-loader" data-app-loader aria-hidden="true"><span class="app-loader__spinner"></span></div>
		<div class="wrapper">
			{{> layouts/Header/Header }}
			<main class="wrapper__content">
				{{> layouts/Sidebar/Sidebar }}
				<div class="wrapper__main">
					<div class="wrapper__container">
						<a href="/employees" class="wrapper__back">
							<svg aria-hidden="true" focusable="false" width="16" height="16"><use href="#icon-arrow-back-thin"></use></svg>
							<span>Назад</span>
						</a>

						<!--
							Профильная заглушка «Сотрудник не найден» (референс для бэка):
							тот же блок .visit-empty — иконка #icon-erp-employees и свои тексты.
						-->
						<section class="data-panel visit-empty">
							<span class="visit-empty__icon">
								<svg aria-hidden="true" focusable="false" width="28" height="28"><use href="#icon-erp-employees"></use></svg>
							</span>
							<h1 class="visit-empty__title">Сотрудник не найден</h1>
							<p class="visit-empty__text">Возможно, карточка сотрудника была удалена или изменился её адрес. Проверьте ссылку или вернитесь к списку сотрудников.</p>
							<div class="visit-empty__actions">
								<a href="/employees" class="btn">К списку сотрудников</a>
								<a href="/" class="btn btn--secondary">На главную</a>
							</div>
						</section>
					</div>
				</div>
			</main>
			{{> layouts/Footer/Footer }}
		</div>
	</body>
</html>
