<!doctype html>
<html lang="ru" data-icons="/bitrix/templates/auth/assets/icons/sprite.svg">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<meta name="format-detection" content="telephone=no" />

		<title>AG</title>

		<!-- initial-load overlay: critical inline styles so it shows before the bundle
		     loads and hides the FOUC (sprite injection / style application) -->
		<style>
			.app-loader {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #eaeef2;
				transition:
					opacity 0.4s ease,
					visibility 0s linear 0.4s;
			}
			.app-loader.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.app-loader__spinner {
				width: 44px;
				height: 44px;
				border-radius: 50%;
				border: 3px solid #dfe7f1;
				border-top-color: #0081ff;
				animation: app-loader-spin 0.7s linear infinite;
			}
			@keyframes app-loader-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.app-loader__spinner {
					animation-duration: 1.6s;
				}
			}
			@layer critical,reset,vendor,base,layout,components,utilities;
			@layer critical {
				.header__wrapper {
					display: flex;
					justify-content: space-between;
					width: 100%;
				}
				.header__inner {
					display: flex;
					align-items: center;
				}
				.filter-search {
					display: none;
				}
				body[data-header-search] .filter-search {
					flex: 0 0 auto;
					align-self: center;
					width: max(266.6666666667px, 26.0416666667vw);
					margin-left: max(32px, 3.125vw);
					margin-right: auto;
				}
				@media (min-width: 1024px) {
					body[data-header-search] .filter-search {
						display: block;
					}
				}
				@media (min-width: 1024px) {
					body[data-header-search] .filter-search {
						flex: 0 1 500px;
						width: auto;
						min-width: 200px;
						margin-left: clamp(20px, 3.125vw, 60px);
					}
				}
				@media (max-width: 1023.98px) {
					body[data-header-search] .filter-search {
						display: block;
						order: 10;
						flex: 0 0 100%;
						width: 100%;
						margin-inline: 0;
					}
					body[data-header-search] .header__wrapper {
						flex-wrap: wrap;
					}
				}
				.filter-search__dropdown {
					position: absolute;
					top: calc(100% + 10px);
					left: 0;
					z-index: 60;
				}
				.filter-search:not(.is-open) .filter-search__dropdown {
					visibility: hidden;
					opacity: 0;
				}
				.filter-search__control {
					position: relative;
				}
				.filter-search__icon {
					position: absolute;
					top: 50%;
					right: 12px;
					transform: translateY(-50%);
					width: 16px;
					height: 16px;
				}
				.profile-dropdown {
					position: relative;
				}
				.profile-dropdown__panel {
					position: absolute;
					top: calc(100% + 8px);
					right: 0;
				}
				.profile-dropdown:not(.is-open) .profile-dropdown__panel {
					opacity: 0;
					pointer-events: none;
					visibility: hidden;
				}
				@media (max-width: 1023.98px) {
					.profile-dropdown__panel {
						position: fixed;
						inset: 0 auto 0 0;
					}
				}
			}
		</style>
		<script>
			window.addEventListener("load", function () {
				var l = document.querySelector("[data-app-loader]");
				if (l) {
					l.classList.add("is-hidden");
					setTimeout(function () {
						l.parentNode && l.remove();
					}, 500);
				}
			});
		</script>

		<meta name="description" content="Стартовый проект на Vite: быстрый и гибкий старт." />

		<link
			rel="preload"
			href="/bitrix/templates/auth/fonts/Inter/Inter-Var-main.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<link rel="icon" type="image/png" href="/bitrix/templates/auth/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/bitrix/templates/auth/favicon/favicon.svg" />
		<link rel="shortcut icon" href="/bitrix/templates/auth/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/bitrix/templates/auth/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/bitrix/templates/auth/favicon/site.webmanifest" />

		<meta property="og:type" content="website" />
		<meta property="og:locale" content="ru_RU" />
		<meta property="og:site_name" content="AG" />
		<meta property="og:title" content="AG" />
		<meta property="og:description" content="Стартовый проект на Vite: быстрый и гибкий старт." />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="AG" />
		<meta name="twitter:description" content="Стартовый проект на Vite: быстрый и гибкий старт." />
		<script type="module" crossorigin src="/bitrix/templates/auth/assets/js/app-jYEERMVj.js"></script>
		<link rel="stylesheet" crossorigin href="/bitrix/templates/auth/assets/css/app-BMwAI309.css" />
	</head>
	<body>
		<div class="app-loader" data-app-loader aria-hidden="true"><span class="app-loader__spinner"></span></div>
		<section class="auth" data-module="Auth" data-path="sections/shared">
			<div class="auth__wrap">
				<a href="/" class="auth__back">
					<svg aria-hidden="true" focusable="false" width="12" height="16">
						<use href="/bitrix/templates/auth/assets/icons/sprite.svg#icon-arrow-back"></use>
					</svg>
					<span>К порталу</span>
				</a>
				<div class="auth__main">
					<picture class="auth__logotype">
						<img src="/bitrix/templates/auth/assets/images/logotype-BSAnmV5C.svg" width="118" height="120" alt="AG" />
					</picture>
					<div class="auth__wrapper">
						<div class="auth__top">
							<span class="auth__title">Восстановление пароля</span>
							<span class="auth__description">
								Для восстановления доступа к порталу обратитесь
								<br />
								в техподдержу по адресу
								<a href="mailto:support@aptphg.by">support@aptphg.by</a>
							</span>
						</div>
						<a class="btn auth__btn" href="/login">К форме входа</a>
					</div>
				</div>
				<span class="auth__slogan">Вместе – мы команда!</span>
			</div>
		</section>
	</body>
</html>
